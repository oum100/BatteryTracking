services:
  postgres:
    image: postgres:16-alpine
    container_name: batterytracking-postgres
    environment:
      POSTGRES_DB: batterytracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d batterytracking']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
